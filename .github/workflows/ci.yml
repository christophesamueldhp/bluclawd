name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS on arm64: the only runner where the reaper and native inspector tests run too.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      # The native inspector trusts only the stock toolchain paths, not the runner's versioned Xcode.
      - run: sudo xcode-select --switch /Library/Developer/CommandLineTools
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
